name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
      - run: npm ci --legacy-peer-deps
      - run: npm run package:build
      - name: Install framework fixture dependencies
        run: |
          for fixture in astro nextjs nuxt sveltekit tanstack-start; do
            npm install --prefix "examples/$fixture" --ignore-scripts --legacy-peer-deps
          done
      - run: npm run typecheck
      - run: npm test
      - run: bun test
      - run: npm run deno:check
      - run: npm run package:imports
      - run: npm run package:consumer
      - run: npm run framework:check
      - run: npm run docs:check
      - run: npm audit --omit=dev
      - run: git diff --check
